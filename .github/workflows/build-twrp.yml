name: Build TWRP for SM-M127F (m12)

# ==================================================================
#  Build TWRP untuk Samsung Galaxy M12 (SM-M127F / m12 / exynos850)
#
#  STRATEGI:
#    - TWRP ditaruh di partisi RECOVERY
#    - Kernel PREBUILT = kernel STOK DWC4 dari HP sendiri
#      (4.19.111-26004678 dpi@SWDK3905, 0 kernelsu/magisk)
#      ==> inilah kernel yang HP TERIMA saat boot normal
#    - Android di partisi boot TIDAK disentuh
#
#  CARA PAKAI:
#    1. Fork repo android_device_samsung_m12
#    2. Ganti isi device tree dengan file-file dari folder ini
#    3. Copy workflow ini ke .github/workflows/build-twrp.yml
#    4. Jalankan Actions -> download artifact
# ==================================================================

on:
  workflow_dispatch:
    inputs:
      manifest_url:
        description: 'TWRP minimal manifest'
        required: false
        default: 'https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git'
      manifest_branch:
        # >>> CATATAN PENTING <<<
        # TWRP TIDAK punya branch "twrp-13.0"!
        # Yang ada hanya: twrp-11, twrp-12.1, twrp-14, twrp-14.1
        # Kita pakai twrp-14.1 (paling baru & lengkap).
        # TWRP adalah RECOVERY, bukan OS — versi manifest-nya
        # tidak harus sama dengan Android 13 di HP.
        description: 'Branch manifest TWRP'
        required: false
        default: 'twrp-14.1'
      kernel_release_url:
        # >>> URL asset kernel.gz dari GitHub Release <<<
        # Kernel 35 MB tidak bisa diunggah lewat web GitHub
        # (batas 25 MB). Jadi ditaruh di Release (batas 2 GB).
        #
        # Cara dapat URL:
        #   1. Repo -> Releases -> Create a new release
        #      tag: kernel-dwc4  judul: "Kernel stok DWC4"
        #   2. Upload kernel.gz sebagai asset
        #   3. Klik kanan asset -> Copy link address
        #      URL-nya bentuknya:
        #      https://github.com/<user>/<repo>/releases/download/kernel-dwc4/kernel.gz
        description: 'URL kernel.gz dari Release (kosongkan kalau sudah ada di repo)'
        required: false
        default: ''

jobs:
  build:
    name: Build TWRP m12
    runs-on: ubuntu-22.04
    timeout-minutes: 350

    steps:
      # ============================================================
      #  WAJIB: ambil isi repo ke runner.
      #  Tanpa step ini $GITHUB_WORKSPACE KOSONG, sehingga
      #  prebuilt/kernel.gz dan devicetree/ tidak ada.
      # ============================================================
      - name: '0a. Checkout repo (ambil prebuilt + devicetree)'
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: '0b. Bukti checkout berhasil'
        run: |
          echo "=== GITHUB_WORKSPACE = $GITHUB_WORKSPACE ==="
          ls -la "$GITHUB_WORKSPACE"
          echo ""
          echo "--- prebuilt/ ---"
          ls -la "$GITHUB_WORKSPACE/prebuilt/" || { echo "!!! prebuilt TIDAK ADA"; exit 1; }
          echo ""
          echo "--- devicetree/ ---"
          ls -la "$GITHUB_WORKSPACE/devicetree/" || { echo "!!! devicetree TIDAK ADA"; exit 1; }
          echo ""
          echo "--- cek file wajib ---"
          for f in "prebuilt/kernel.gz" "prebuilt/dtb.img" "devicetree/BoardConfig.mk" "devicetree/device.mk" "devicetree/omni_m12.mk"; do
            if [ -s "$GITHUB_WORKSPACE/$f" ]; then
              echo "  [OK] $f  ($(stat -c%s "$GITHUB_WORKSPACE/$f") B)"
            else
              echo "  [GAGAL] $f HILANG"
              exit 1
            fi
          done
          echo ""
          echo "=== CHECKOUT LENGKAP ==="

      # ============================================================
      - name: '0. Info sistem'
        run: |
          echo "=== Info runner ==="
          uname -a
          nproc
          free -h
          df -h /

      # ============================================================
      - name: '1. Siapkan paket yang dibutuhkan'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            bc bison build-essential ccache curl flex g++-multilib \
            gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev \
            lib32readline-dev lib32z1-dev libelf-dev liblz4-tool \
            libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev \
            libxml2 libxml2-utils lzop pngcrush rsync schedtool \
            squashfs-tools xsltproc zip zlib1g-dev python3 python-is-python3 \
            openjdk-11-jdk android-sdk-libsparse-utils
          echo "OK paket terpasang"

      # ============================================================
      - name: '2. Git config + repo tool'
        run: |
          git config --global user.name  "Kuyukbot1"
          git config --global user.email "kuyukbot1@users.noreply.github.com"
          git config --global color.ui false

          mkdir -p ~/bin
          curl -sSL "https://storage.googleapis.com/git-repo-downloads/repo" \
            -o ~/bin/repo
          chmod +x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH
          ~/bin/repo --version

      # ============================================================
      - name: '3. Cek branch manifest ada atau tidak'
        run: |
          URL="${{ inputs.manifest_url }}"
          BR="${{ inputs.manifest_branch }}"

          echo "manifest : $URL"
          echo "branch   : $BR"
          echo ""

          echo "=== branch yang TERSEDIA di manifest TWRP ==="
          git ls-remote --heads "$URL" 2>/dev/null | \
            awk '{print "   " $2}' | sed 's|refs/heads/||' || true
          echo ""

          # cek branch yang diminta
          if git ls-remote --heads "$URL" "refs/heads/$BR" 2>/dev/null | grep -q .; then
            echo "[OK] branch '$BR' ADA"
          else
            echo "[GAGAL] branch '$BR' TIDAK ADA di manifest ini"
            echo ""
            echo "TWRP TIDAK punya branch twrp-13.0."
            echo "Yang ada: twrp-11, twrp-12.1, twrp-14, twrp-14.1"
            echo "Gunakan twrp-14.1."
            exit 1
          fi

      # ============================================================
      - name: '4. Clone TWRP manifest (shallow)'
        run: |
          mkdir -p ~/twrp
          cd ~/twrp
          repo init \
            --depth=1 \
            -u "${{ inputs.manifest_url }}" \
            -b "${{ inputs.manifest_branch }}"
          echo "=== manifest OK ==="
          echo "--- isi .repo/manifests/default.xml (awal) ---"
          head -20 .repo/manifests/default.xml 2>/dev/null || true

      # ============================================================
      - name: '5. Ambil device tree + buang kernel DXJ3 bawaan'
        run: |
          cd ~/twrp
          mkdir -p device/samsung/m12/prebuilt

          # ---- device tree dari repo user ----
          # CATATAN: repo WAJIB Surya26668 (tempat kernel.gz + twrp_m12.mk
          # berada). Repo Kuyukbot1 masih punya AndroidProducts.mk LAMA
          # (omni_m12) dan TIDAK punya twrp_m12.mk -> lunch pasti gagal.
          git clone --depth=1 \
            -b "m12nsxx-user-13-TP1A.220624.014-M127FXXS9DXJ3-release-keys" \
            https://github.com/Surya26668/android_device_samsung_m12.git \
            /tmp/dt-src

          # copy semua file (kecuali .git) ke device/samsung/m12
          rsync -a --exclude='.git' /tmp/dt-src/ device/samsung/m12/

          echo "=== isi device tree ==="
          ls -la device/samsung/m12/
          echo "--- prebuilt ---"
          ls -la device/samsung/m12/prebuilt/

          # ---- hapus kernel DXJ3 bawaan (beda firmware) ----
          rm -f device/samsung/m12/prebuilt/kernel
          rm -f device/samsung/m12/prebuilt/dtb.img
          echo "kernel DXJ3 bawaan dihapus (beda firmware dgn HP)"

      # ============================================================
      - name: '6. Pasang prebuilt kernel STOK DWC4 + terapkan perbaikan'
        run: |
          cd ~/twrp
          D=device/samsung/m12

          # ---- kernel ----
          # >>> CARA AMBIL KERNEL <<<
          # Kernel mentah = 35 MB, kernel.gz = 16 MB.
          # Keduanya GAGAL di web upload GitHub ("Something went
          # really wrong") padahal batas resminya 25 MB.
          #
          # SOLUSI: kernel.gz ditaruh di GitHub RELEASE
          # (batas Release = 2 GB, tidak akan gagal).
          #
          # Urutan percobaan:
          #   1. download dari Release   <- CARA UTAMA
          #   2. prebuilt/kernel.gz di repo (kalau suatu saat ada)
          #   3. prebuilt/kernel mentah di repo
          mkdir -p $D/prebuilt
          echo "=== SIAPKAN KERNEL ==="
          echo "--- isi workspace/prebuilt ---"
          ls -la $GITHUB_WORKSPACE/prebuilt/ || true
          echo ""

          GOT=0

          # --- cara 1: GitHub Release ---
          REL_URL="${{ inputs.kernel_release_url }}"
          if [ -n "$REL_URL" ]; then
            echo ">>> cara 1: unduh kernel dari Release"
            echo "    URL: $REL_URL"
            if curl -sSL --fail --retry 3 -o /tmp/kernel.gz "$REL_URL"; then
              KSZ=$(stat -c%s /tmp/kernel.gz)
              echo "    terunduh: $KSZ B"
              if [ "$KSZ" -gt 1000000 ]; then
                gunzip -c /tmp/kernel.gz > $D/prebuilt/kernel
                echo "    dibuka: $(stat -c%s $D/prebuilt/kernel) B"
                GOT=1
              else
                echo "    !!! file terlalu kecil, kemungkinan bukan kernel"
                head -c 200 /tmp/kernel.gz
                echo ""
              fi
            else
              echo "    !!! gagal unduh dari Release"
              echo "    cek: apakah Release sudah dibuat & asset-nya ada?"
              echo "    URL yang dipakai: $REL_URL"
            fi
          else
            echo ">>> cara 1 dilewati (input kernel_release_url kosong)"
          fi

          # --- cara 2: kernel.gz di repo ---
          if [ "$GOT" = "0" ] && [ -f "$GITHUB_WORKSPACE/prebuilt/kernel.gz" ]; then
            echo ">>> cara 2: kernel.gz ada di repo"
            gunzip -c "$GITHUB_WORKSPACE/prebuilt/kernel.gz" > $D/prebuilt/kernel
            echo "    dibuka: $(stat -c%s $D/prebuilt/kernel) B"
            GOT=1
          fi

          # --- cara 3: kernel mentah di repo ---
          if [ "$GOT" = "0" ] && [ -f "$GITHUB_WORKSPACE/prebuilt/kernel" ]; then
            echo ">>> cara 3: kernel mentah ada di repo"
            cp "$GITHUB_WORKSPACE/prebuilt/kernel" $D/prebuilt/kernel
            GOT=1
          fi

          if [ "$GOT" = "0" ]; then
            echo ""
            echo "!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!"
            echo "  KERNEL TIDAK DITEMUKAN"
            echo "!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!"
            echo ""
            echo "  Perlu salah satu dari:"
            echo "   a) isi input 'kernel_release_url' dengan URL asset"
            echo "      Release yang berisi kernel.gz"
            echo "   b) unggah prebuilt/kernel.gz ke repo"
            echo "   c) unggah prebuilt/kernel ke repo"
            echo ""
            exit 1
          fi

          # --- dtb: selalu ambil dari repo (kecil, 128 KB) ---
          if [ ! -f "$GITHUB_WORKSPACE/prebuilt/dtb.img" ]; then
            echo "!!! TIDAK ADA dtb.img di workspace/prebuilt/"
            exit 1
          fi
          cp "$GITHUB_WORKSPACE/prebuilt/dtb.img" $D/prebuilt/dtb.img

          echo ""
          echo "=== prebuilt kernel yang dipakai ==="
          ls -la $D/prebuilt/
          echo ""
          echo "--- VERIFIKASI: kernel harus STOK (0 kernelsu/magisk) ---"
          KERNEL=$D/prebuilt/kernel
          SIZE=$(stat -c%s $KERNEL)
          echo "ukuran kernel : $SIZE B"
          if [ "$SIZE" != "37191692" ]; then
            echo "!!! UKURAN KERNEL SALAH, harusnya 37191692 B"
            echo "    dapat: $SIZE"
            exit 1
          fi
          echo "ukuran OK (sama dgn kernel stok di HP)"

          SHA=$(sha1sum $KERNEL | awk '{print $1}')
          echo "sha1          : $SHA"
          if [ "$SHA" != "e00f114d096b13fc512ab271181e8300672b9c23" ]; then
            echo "!!! SHA1 TIDAK COCOK"
            echo "    harusnya: e00f114d096b13fc512ab271181e8300672b9c23"
            exit 1
          fi
          echo "sha1 OK"

          KSU=$(strings -n 4 $KERNEL | grep -ci kernelsu || true)
          MAG=$(strings -n 4 $KERNEL | grep -ci magisk   || true)
          echo "jumlah 'kernelsu' : $KSU"
          echo "jumlah 'magisk'   : $MAG"
          if [ "$KSU" != "0" ] || [ "$MAG" != "0" ]; then
            echo "!!! KERNEL TIDAK BERSIH - STOP"
            exit 1
          fi

          echo ""
          echo "--- versi kernel ---"
          strings -n 4 $KERNEL | grep -m1 "^Linux version"
          echo ""
          echo "=== KERNEL STOK BERSIH - AMAN ==="

          DTB=$D/prebuilt/dtb.img
          DSZ=$(stat -c%s $DTB)
          echo "ukuran dtb : $DSZ B (harusnya 128116)"
          if [ "$DSZ" != "128116" ]; then
            echo "!!! UKURAN DTB SALAH"
            exit 1
          fi

          # ---- timpa file device tree yang diperbaiki ----
          echo ""
          echo "=== TIMPA file yang sudah diperbaiki ==="
          for f in BoardConfig.mk device.mk omni_m12.mk twrp_m12.mk; do
            if [ -f "$GITHUB_WORKSPACE/devicetree/$f" ]; then
              cp "$GITHUB_WORKSPACE/devicetree/$f" "$D/$f"
              echo "  ditimpa: $f ($(wc -l < $D/$f) baris)"
            else
              echo "  !!! TIDAK ADA: workspace/devicetree/$f"
              exit 1
            fi
          done

          # AndroidProducts.mk + twrp_m12.mk di root repo
          # (bukan di devicetree/) -> salin ke device tree
          for f in AndroidProducts.mk twrp_m12.mk; do
            if [ -f "$GITHUB_WORKSPACE/$f" ]; then
              cp "$GITHUB_WORKSPACE/$f" "$D/$f"
              echo "  disalin: $f ($(wc -l < $D/$f) baris)"
            else
              echo "  !!! TIDAK ADA di root repo: $f"
              exit 1
            fi
          done

      # ============================================================
      - name: '7. Cek konfigurasi sebelum build'
        run: |
          cd ~/twrp
          D=device/samsung/m12

          echo "=============================================="
          echo "  CEK KRITIS"
          echo "=============================================="

          fail=0

          # kernel prebuilt ada?
          if [ ! -s "$D/prebuilt/kernel" ]; then
            echo "[GAGAL] prebuilt/kernel tidak ada"; fail=1
          else
            echo "[OK] prebuilt/kernel ada ($(stat -c%s $D/prebuilt/kernel) B)"
          fi

          # dtb ada?
          if [ ! -s "$D/prebuilt/dtb.img" ]; then
            echo "[GAGAL] prebuilt/dtb.img tidak ada"; fail=1
          else
            echo "[OK] prebuilt/dtb.img ada ($(stat -c%s $D/prebuilt/dtb.img) B)"
          fi

          # device.mk TIDAK BOLEH cuma 1 baris
          LINES=$(wc -l < $D/device.mk)
          if [ "$LINES" -lt 5 ]; then
            echo "[GAGAL] device.mk cuma $LINES baris (harus diisi!)"; fail=1
          else
            echo "[OK] device.mk terisi ($LINES baris)"
          fi

          # platform harus exynos850
          if grep -q "TARGET_BOARD_PLATFORM := exynos850" $D/BoardConfig.mk; then
            echo "[OK] TARGET_BOARD_PLATFORM = exynos850"
          else
            echo "[GAGAL] TARGET_BOARD_PLATFORM salah"; fail=1
          fi

          # fingerprint harus DWC4
          if grep -q "DWC4" $D/omni_m12.mk; then
            echo "[OK] fingerprint = DWC4 (sesuai HP)"
          else
            echo "[PERINGATAN] fingerprint bukan DWC4"
          fi

          # partisi recovery harus 46137344
          if grep -q "BOARD_RECOVERYIMAGE_PARTITION_SIZE := 46137344" $D/BoardConfig.mk; then
            echo "[OK] ukuran partisi recovery = 46137344 B"
          else
            echo "[PERINGATAN] ukuran partisi recovery beda"
          fi

          # harus ada config TWRP
          if grep -q "TW_THEME" $D/BoardConfig.mk; then
            echo "[OK] konfigurasi TWRP ada"
          else
            echo "[GAGAL] konfigurasi TWRP tidak ada"; fail=1
          fi

          echo "=============================================="
          if [ "$fail" != "0" ]; then
            echo "ADA YANG GAGAL - batalkan"
            exit 1
          fi
          echo "SEMUA CEK LULUS"
          echo "=============================================="

      # ============================================================
      - name: '8. Sinkronkan source (repo sync)'
        run: |
          cd ~/twrp
          echo "Mulai repo sync (bisa 1-2 jam)..."

          # ------------------------------------------------------------
          #  android.googlesource.com kadang balas HTTP 503 atau
          #  "784 bytes of body are still expected" = gangguan jaringan
          #  sementara, BUKAN kesalahan kode.
          #
          #    --retry-fetches=5  ulangi otomatis saat fetch gagal
          #    --no-fail-fast     jangan berhenti di error pertama
          #    -j4                kurangi paralel, server lebih ramah
          #
          #  PENTING: '--fail-fast' TIDAK menerima nilai. Menulis
          #  '--fail-fast=false' membuat repo error:
          #     "option does not take a value"
          #  Pakai '--no-fail-fast' (tanpa '=').
          #
          #  Dicoba 3x, jeda 60 detik antar percobaan.
          # ------------------------------------------------------------

          # Kalau run sebelumnya gagal separuh, sisa repo bisa korup.
          # Bersihkan supaya percobaan berikutnya tidak ikut gagal.
          echo "=== bersihkan sisa sync yang rusak (kalau ada) ==="
          for d in prebuilts/misc prebuilts/module_sdk/Uwb \
                   prebuilts/vndk/v29 prebuilts/vndk/v30 \
                   system/hardware/interfaces system/keymaster ; do
            if [ -d "$d" ] && [ ! -d "$d/.git" ]; then
              echo "  hapus folder rusak: $d"
              rm -rf "$d"
            fi
          done

          OK=0
          for attempt in 1 2 3; do
            echo ""
            echo "########## repo sync percobaan $attempt dari 3 ##########"

            # Cek opsi mana yang didukung versi repo di runner ini.
            # Opsi yang tidak dikenal membuat repo langsung error:
            #    "main.py: error: unrecognized arguments: ..."
            HELP="$(repo sync --help 2>&1 || true)"
            OPT=""
            if echo "$HELP" | grep -q -- "--retry-fetches"; then
              OPT="$OPT --retry-fetches=5"
            fi
            if echo "$HELP" | grep -q -- "--no-fail-fast"; then
              OPT="$OPT --no-fail-fast"
            fi
            echo "  opsi tambahan yang dipakai:$OPT"

            # '--fail-fast' TIDAK menerima nilai. Menulis
            # '--fail-fast=false' membuat repo error
            #   "option does not take a value"
            # Pakai '--no-fail-fast' (tanpa '=').
            if repo sync -c -j4 \
                 --force-sync \
                 --no-clone-bundle \
                 --no-tags \
                 $OPT ; then
              OK=1
              echo ">>> repo sync BERHASIL pada percobaan $attempt"
              break
            fi
            echo ""
            echo ">>> percobaan $attempt gagal, tunggu 60 detik..."
            sleep 60
          done

          if [ "$OK" != "1" ]; then
            echo ""
            echo "=============================================================="
            echo "  repo sync GAGAL 3x"
            echo "=============================================================="
            echo "  Lihat pesan error DI ATAS untuk penyebab sebenarnya."
            echo ""
            echo "  Kalau pesannya HTTP 503 / 'bytes of body are still"
            echo "  expected' -> gangguan android.googlesource.com."
            echo "  Solusi: run ulang workflow 10-30 menit lagi."
            echo "=============================================================="
            echo "=============================================================="
            exit 1
          fi

          echo "=== repo sync selesai ==="
          du -sh ~/twrp

      # ============================================================
      - name: '9. Bersihkan & build'
        run: |
          cd ~/twrp
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C

          # ------------------------------------------------------------
          #  Pastikan device tree LENGKAP sebelum build.
          #  AndroidProducts.mk + twrp_m12.mk + vendorsetup.sh harus
          #  ada, kalau tidak "lunch" akan gagal:
          #     "Invalid lunch combo: twrp_m12-eng"
          # ------------------------------------------------------------
          D=device/samsung/m12
          echo "=== CEK DEVICE TREE SEBELUM BUILD ==="
          for f in AndroidProducts.mk BoardConfig.mk device.mk twrp_m12.mk recovery.fstab prebuilt/kernel prebuilt/dtb.img; do
            if [ -s "$D/$f" ]; then
              echo "  [OK] $f ($(stat -c%s $D/$f) B)"
            else
              echo "  [GAGAL] $D/$f HILANG"
              exit 1
            fi
          done
          echo ""
          echo "--- AndroidProducts.mk ---"
          cat $D/AndroidProducts.mk
          echo ""
          echo "--- prebuilt/ ---"
          ls -la $D/prebuilt/
          echo ""

          # ------------------------------------------------------------
          #  DEBUG: buktikan vendor/twrp ada (dibutuhkan twrp_m12.mk)
          #  Kalau vendor/twrp/config/common.mk TIDAK ADA, lunch akan
          #  gagal SENYAP dan cuma bilang "Invalid lunch combo".
          # ------------------------------------------------------------
          echo "=== [DEBUG] vendor/twrp ==="
          if [ -f vendor/twrp/config/common.mk ]; then
            echo "  [OK] vendor/twrp/config/common.mk ADA"
          else
            echo "  [GAGAL] vendor/twrp/config/common.mk TIDAK ADA"
            echo "  -> repo sync tidak lengkap, lunch pasti gagal"
            exit 1
          fi

          echo ""
          echo "=== [DEBUG] apakah AndroidProducts.mk ditemukan envsetup? ==="
          echo "  D = $D"
          ls -la $D/AndroidProducts.mk

          echo ""
          echo "=== [DEBUG] isi $D/AndroidProducts.mk (hexdump awal) ==="
          head -c 200 $D/AndroidProducts.mk | od -c | head -5

          # ------------------------------------------------------------
          #  vendorsetup.sh obsolete -> ganti jadi kosong
          # ------------------------------------------------------------
          echo "# kosong - TWRP 14 pakai AndroidProducts.mk" > $D/vendorsetup.sh

          source build/envsetup.sh

          echo ""
          echo "=== [DEBUG] FUNGSI & VARIABEL LUNCH ==="
          echo "  tipe 'lunch'     : $(type -t lunch)"
          echo "  ada add_lunch_combo: $(type -t add_lunch_combo || echo 'TIDAK ADA')"
          echo ""
          echo "=== [DEBUG] CARI AndroidProducts.mk DI SEMUA TEMPAT ==="
          find device/samsung -name "AndroidProducts.mk" 2>/dev/null || echo "  TIDAK DITEMUKAN"
          echo ""
          echo "=== [DEBUG] LUNCH MENU (dari envsetup) ==="
          echo "  TARGET_PRODUCT sebelum lunch = '$TARGET_PRODUCT'"
          echo ""
          echo "  coba: print_lunch_menu"
          print_lunch_menu 2>&1 | head -30 || echo "  print_lunch_menu gagal"

          echo "=== lunch ==="
          # TWRP 14 pakai prefix "twrp_", bukan "omni_".
          # Jangan pakai 'set -e' di sini: kita ingin coba beberapa
          # nama dan lihat pesan error aslinya, bukan mati senyap.
          lunch twrp_m12-eng
          LUNCH_RC=$?
          echo "  lunch twrp_m12-eng -> exit code $LUNCH_RC"

          if [ "$LUNCH_RC" != "0" ]; then
            echo ""
            echo "=== lunch gagal, coba alternatif ==="
            for combo in twrp_m12-userdebug twrp_m12-user; do
              echo "  coba: $combo"
              lunch $combo
              if [ $? -eq 0 ]; then
                LUNCH_RC=0
                echo "  >>> $combo BERHASIL"
                break
              fi
            done
          fi

          if [ "$LUNCH_RC" != "0" ]; then
            echo ""
            echo "=============================================================="
            echo "  SEMUA LUNCH GAGAL"
            echo "=============================================================="
            echo "  Artinya AndroidProducts.mk TIDAK terbaca oleh envsetup.sh."
            echo "  Lihat bagian [DEBUG] di atas untuk detail."
            echo "=============================================================="
            exit 1
          fi

          echo ""
          echo "=== cek TARGET_PRODUCT ==="
          echo "  TARGET_PRODUCT = $TARGET_PRODUCT"
          echo "  TARGET_DEVICE  = $TARGET_DEVICE"
          if [ "$TARGET_DEVICE" != "m12" ]; then
            echo "!!! TARGET_DEVICE salah, harusnya m12"
            exit 1
          fi
          echo ""

          echo "=== mulai build recovery image ==="
          mka recoveryimage -j$(nproc --all) 2>&1 | tail -150

          echo ""
          echo "=== hasil ==="
          find out/target/product/m12 -maxdepth 1 -name "*.img" -exec ls -la {} \; 2>/dev/null || true

      # ============================================================
      - name: '10. Verifikasi hasil build'
        run: |
          cd ~/twrp
          OUT=out/target/product/m12

          echo "=============================================="
          echo "  VERIFIKASI HASIL"
          echo "=============================================="

          FOUND=0
          for f in recovery.img recovery.tar boot.img; do
            if [ -f "$OUT/$f" ]; then
              echo "[ADA] $f  ($(stat -c%s $OUT/$f) B)"
              FOUND=1
            fi
          done

          if [ "$FOUND" = "0" ]; then
            echo "!!! TIDAK ADA IMAGE HASIL BUILD"
            ls -la $OUT/ || true
            exit 1
          fi

          if [ -f "$OUT/recovery.img" ]; then
            echo ""
            echo "--- cek magic recovery.img ---"
            xxd -l 16 $OUT/recovery.img
            echo ""
            echo "--- cek ukuran vs partisi (46137344 B) ---"
            RSZ=$(stat -c%s $OUT/recovery.img)
            echo "ukuran recovery.img : $RSZ B"
            if [ "$RSZ" -gt 46137344 ]; then
              echo "[PERINGATAN] lebih besar dari partisi recovery HP!"
            else
              echo "[OK] muat di partisi recovery"
            fi
          fi

      # ============================================================
      - name: '11. Bungkus jadi tar untuk Odin'
        if: success()
        run: |
          cd ~/twrp
          OUT=out/target/product/m12
          mkdir -p /tmp/odin

          if [ -f "$OUT/recovery.img" ]; then
            cp $OUT/recovery.img /tmp/odin/recovery.img

            # tar USTAR murni (Odin tidak suka PAX header!)
            cd /tmp/odin
            tar --format=ustar -cf AP_TWRP-m12.tar recovery.img

            echo "=== tar dibuat ==="
            ls -la /tmp/odin/
            echo ""
            echo "--- cek format tar (harus typeflag 0, tanpa PaxHeader) ---"
            dd if=/tmp/odin/AP_TWRP-m12.tar bs=1 skip=156 count=1 2>/dev/null | xxd
            echo ""
            head -c 2048 /tmp/odin/AP_TWRP-m12.tar | strings | head -3
          fi

      # ============================================================
      - name: '12. Upload artifact'
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TWRP-m12
          path: |
            /home/runner/twrp/out/target/product/m12/*.img
            /home/runner/twrp/out/target/product/m12/*.tar
            /tmp/odin/*.tar
          if-no-files-found: warn
          retention-days: 30

      # ============================================================
      - name: '13. Ringkasan'
        if: always()
        run: |
          echo "=============================================="
          echo "  SELESAI"
          echo "=============================================="
          echo "Kalau build sukses:"
          echo "  1. Download artifact TWRP-m12"
          echo "  2. Ambil AP_TWRP-m12.tar"
          echo "  3. Flash via Odin: AP saja, BL/CP/CSC KOSONG"
          echo "  4. Re-Partition WAJIB OFF"
          echo ""
          echo "Masuk TWRP:"
          echo "  adb reboot recovery       (dari Android)"
          echo "  atau Volume Up + colok USB"
          echo "=============================================="
